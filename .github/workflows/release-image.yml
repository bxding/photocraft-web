name: Package PhotoCraft release

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Resolve latest stable release
        id: release
        run: |
          echo "version=$(python3 scripts/download-release.py latest)" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Validate Compose
        run: docker compose -f docker-compose.yaml -f compose.build.yaml config --quiet
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Package test image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          pull: true
          platforms: linux/amd64
          tags: ghcr.io/bxding/photocraft-web-docker:latest
          build-args: PHOTOCRAFT_VERSION=${{ steps.release.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test released web assets
        run: |
          docker compose up -d --pull never --wait
          curl --fail --silent http://127.0.0.1:8080/healthz
          curl --fail --silent http://127.0.0.1:8080/ > /tmp/index.html
          test -s /tmp/index.html
          curl --fail --silent http://127.0.0.1:8080/release.json
          wasm=$(docker compose exec -T photocraft sh -c 'cd /usr/share/nginx/html; ls *.wasm' | head -n 1 | tr -d '\r')
          curl --fail --silent --head "http://127.0.0.1:8080/$wasm" | grep -i 'content-type: application/wasm'
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/missing.wasm)" = 404
      - name: Container logs and cleanup
        if: always()
        run: |
          docker compose logs
          docker compose down
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested release for amd64 and arm64
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: PHOTOCRAFT_VERSION=${{ steps.release.outputs.version }}
          tags: |
            ${{ steps.release.outputs.image }}:latest
            ${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.description=PhotoCraft official web release served by NGINX
          cache-from: type=gha
          cache-to: type=gha,mode=max
